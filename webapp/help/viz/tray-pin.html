<!-- Pinning the tray icon: the pointer opens "Show hidden icons" (^), drags
     Resound's icon from the box onto the taskbar, and the arrow moves aside
     for it. One 10 s loop, all in help.css (.vp-*); without motion, the end
     state with a dashed arrow. The right end of a Windows 11 taskbar, cropped
     from the left on narrow screens. -->
<div class="vp" role="img" aria-label="The right end of the Windows taskbar, next to the clock. The pointer clicks the Show hidden icons arrow, a box with hidden tray icons opens, and the pointer drags the Resound icon out of it onto the taskbar, where it stays next to the arrow.">
    <svg viewBox="0 0 520 220" aria-hidden="true">
        <defs>
            <radialGradient id="vp-wall" cx="0.7" cy="0.1" r="0.9">
                <stop offset="0" stop-color="#2c3b45"/>
                <stop offset="1" stop-color="#1d2228"/>
            </radialGradient>
            <marker id="vp-head" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="#50dea8"/>
            </marker>
        </defs>
        <rect class="vp-wall" width="520" height="220" fill="url(#vp-wall)"/>

        <!-- The taskbar: apps on the left, the tray on the right -->
        <rect class="vz-bar" y="172" width="520" height="48"/>
        <line class="vz-bar-edge" x1="0" y1="172.5" x2="520" y2="172.5"/>
        <g class="vz-start">
            <rect x="59" y="185" width="10" height="10" rx="1.5"/><rect x="71" y="185" width="10" height="10" rx="1.5"/>
            <rect x="59" y="197" width="10" height="10" rx="1.5"/><rect x="71" y="197" width="10" height="10" rx="1.5"/>
        </g>
        <g class="vz-line"><circle cx="102" cy="194" r="5.5"/><path d="M106 198 l4.5 4.5"/></g>
        <rect class="vz-app" x="127" y="185" width="22" height="22" rx="5" fill="#3b4a63"/>
        <rect class="vz-app" x="161" y="185" width="22" height="22" rx="5" fill="#4a3b55"/>
        <rect class="vz-app" x="195" y="185" width="22" height="22" rx="5" fill="#3b5548"/>
        <rect class="vz-running" x="135" y="213" width="6" height="3" rx="1.5"/>

        <rect class="vp-hover" x="318" y="184" width="24" height="24" rx="4"/>
        <g class="vp-chev"><path class="vz-line" d="M325 199 l5 -5 l5 5"/></g>
        <image class="vp-pinned" href="/assets/resound-192.png" x="320" y="186" width="20" height="20"/>
        <text class="vz-small" x="362" y="193" text-anchor="middle">ENG</text>
        <text class="vz-tiny" x="362" y="206" text-anchor="middle">US</text>
        <g class="vz-line">
            <path d="M386.5 195.5 a10.5 10.5 0 0 1 15 0"/><path d="M389.3 198.6 a6.5 6.5 0 0 1 9.4 0"/>
            <circle class="vz-fill" cx="394" cy="202" r="1.6"/>
        </g>
        <path class="vz-fill" d="M410 193 h3 l5 -4 v14 l-5 -4 h-3 z"/>
        <g class="vz-line"><path d="M421 192.5 a5 5 0 0 1 0 8"/><path d="M423.5 189.5 a9 9 0 0 1 0 14"/></g>
        <text class="vz-small" x="508" y="192" text-anchor="end">2:32 PM</text>
        <text class="vz-small" x="508" y="206" text-anchor="end">10/19/2026</text>

        <!-- Show hidden icons: the box above the arrow -->
        <g class="vp-flyout">
            <rect class="vz-menu" x="270" y="88" width="120" height="76" rx="8"/>
            <rect x="286" y="103" width="16" height="16" rx="4" fill="#6b8fd6"/>
            <rect x="322" y="103" width="16" height="16" rx="8" fill="#c9a24b"/>
            <rect x="358" y="103" width="16" height="16" rx="4" fill="#8a8f9c"/>
            <rect x="286" y="133" width="16" height="16" rx="8" fill="#57a37f"/>
            <rect x="322" y="133" width="16" height="16" rx="4" fill="#b86b8f"/>
            <image class="vp-fly-icon" href="/assets/resound-192.png" x="356" y="131" width="20" height="20"/>
        </g>
        <path class="vp-arrow" d="M362 156 Q 356 178 340 190" marker-end="url(#vp-head)"/>

        <circle class="vz-ring vp-ring-open" cx="330" cy="196" r="10"/>
        <circle class="vz-ring vp-ring-grab" cx="366" cy="141" r="10"/>
        <g class="vp-drag"><image href="/assets/resound-192.png" x="-11" y="-11" width="22" height="22"/></g>
        <g class="vz-pointer vp-pointer"><path d="M0 0 V16 L4.5 12 L7.5 18.5 L10 17.4 L7 11 H12.5 Z"/></g>
    </svg>
</div>
