<!-- What voice processing does to a sound: the toggle switches data-mode
     (help.js, which also flips it by itself until it is used). Bars marked
     "cut" are the ones taken for noise. -->
<div class="vd" data-mode="on" data-viz-modes="on off">
    <div class="vd-toggle" role="group" aria-label="Discord's noise suppression">
        <button type="button" data-mode-set="on" aria-pressed="true">Noise suppression on</button>
        <button type="button" data-mode-set="off" aria-pressed="false">Off</button>
    </div>
    <div class="vd-row" role="img" aria-label="A sound goes into Discord. With noise suppression on, most of it is taken for background noise and arrives cut off and quiet. With it off, it arrives as it plays.">
        <div class="vd-stage">
            <span class="vd-cap">Resound plays</span>
            <div class="vd-wave vd-in" aria-hidden="true">
                <i style="--h:.35;--d:0"></i><i style="--h:.6;--d:1"></i><i style="--h:.9;--d:2"></i><i style="--h:.7;--d:3"></i><i style="--h:.45;--d:4"></i><i style="--h:.8;--d:5"></i><i style="--h:1;--d:6"></i><i style="--h:.65;--d:7"></i><i style="--h:.4;--d:8"></i><i style="--h:.75;--d:9"></i><i style="--h:.55;--d:10"></i><i style="--h:.85;--d:11"></i><i style="--h:.5;--d:12"></i><i style="--h:.3;--d:13"></i><i style="--h:.7;--d:14"></i><i style="--h:.95;--d:15"></i><i style="--h:.6;--d:16"></i><i style="--h:.4;--d:17"></i>
            </div>
        </div>
        <div class="vd-filter">
            <span class="icon" data-icon="headset_mic" aria-hidden="true"></span>
            <strong>Discord</strong>
            <em data-when="on">“That's noise”</em>
            <em data-when="off">passes it on</em>
        </div>
        <div class="vd-stage">
            <span class="vd-cap">Your friends hear</span>
            <div class="vd-wave vd-out" aria-hidden="true">
                <i style="--h:.35"></i><i class="cut" style="--h:.6"></i><i class="cut" style="--h:.9"></i><i style="--h:.7"></i><i class="cut" style="--h:.45"></i><i class="cut" style="--h:.8"></i><i style="--h:1"></i><i class="cut" style="--h:.65"></i><i class="cut" style="--h:.4"></i><i class="cut" style="--h:.75"></i><i style="--h:.55"></i><i class="cut" style="--h:.85"></i><i class="cut" style="--h:.5"></i><i class="cut" style="--h:.3"></i><i style="--h:.7"></i><i class="cut" style="--h:.95"></i><i class="cut" style="--h:.6"></i><i class="cut" style="--h:.4"></i>
            </div>
        </div>
    </div>
    <p class="vd-verdict" aria-live="polite">
        <span data-when="on">Music and effects are taken for background noise: cut off, choppy and quiet.</span>
        <span data-when="off">The sound arrives as it plays.</span>
    </p>
</div>
