# The installable app (webapp/), hosted as a static site. Netlify runs the
# build from the repository root; Go comes from the build image, and the
# toolchain line in go.mod fetches the exact version.
[build]
  command = "go run ./cmd/webapp -out webapp/dist"
  publish = "webapp/dist"
  # Skip the deploy when the app did not change.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- webapp/ cmd/webapp/ netlify.toml"
