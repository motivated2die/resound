# Checks every push to main and every pull request: formatting, vet, tests
# and a build. Releases are built by release.yml when a version tag is pushed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod # the toolchain line pins the exact Go release

      - name: gofmt
        shell: pwsh
        run: |
          $files = gofmt -l .
          if ($files) { $files; throw "These files need gofmt -w" }

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go build
        run: go build -o resound-ci.exe ./cmd/resound

      - name: build the installable app
        run: go run ./cmd/webapp
